services:
  # Backend API Service
  - type: web
    name: pos-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd src/backend && npm install
    startCommand: cd src/backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: SESSION_SECRET
        generateValue: true
      - key: TZ
        value: Asia/Karachi
      - key: CORS_ORIGIN
        fromService:
          name: pos-frontend
          type: web
          property: host

  # Frontend Service
  - type: web
    name: pos-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port 80
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          name: pos-backend
          type: web
          property: host

# PostgreSQL Database
databases:
  - name: pos-database
    databaseName: pos_system
    user: pos_admin
    region: oregon
    plan: free
    postgresMajorVersion: "14"
