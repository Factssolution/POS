services:
  - type: web
    name: pos-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd src/backend && npm install
    startCommand: cd src/backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: db.hfusrtiqjyiotjewzzkt.supabase.co
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        value: https://pos-iota-sage.vercel.app,http://localhost:5173
