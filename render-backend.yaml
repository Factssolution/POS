services:
  - type: web
    name: pos-backend
    env: node
    region: oregon
    plan: free
    rootDir: src/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        value: https://pos-iota-sage.vercel.app
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_DIR
        value: ./uploads
      - key: BACKUP_DIR
        value: ./backups
      - key: BACKUP_RETENTION_DAYS
        value: 30
      - key: TZ
        value: Asia/Karachi
